data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GraphSAGE"
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  use_confidence: false

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "sage_batch16_no_conf_erjon"

notes:
  experiment_goal: "GraphSAGE batch size experiment - smaller batch"
  node_features: "[x, y]"
  comments: "Testing whether smaller batches improve generalization despite noisier updates"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"