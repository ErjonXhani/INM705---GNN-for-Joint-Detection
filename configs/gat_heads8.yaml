data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GAT"
  hidden_dim: 64
  num_layers: 3
  heads: 8
  dropout: 0.6
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gat_heads8_omari"

notes:
  experiment_goal: "Test whether more attention heads improve GAT performance"
  node_features: "[x, y, confidence]"
  comments: "Uses more heads but smaller hidden size to keep model size more reasonable"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"