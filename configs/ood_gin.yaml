
data:
  processed_dir: "keypoints_ood"
  splits_dir: "data/splits_ood"
  
model:
  name: "GIN"
  hidden_dim: 128
  num_layers: 2
  dropout: 0.7
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gin_final_erjon"

notes:
  experiment_goal: "Final optimized GIN model"
  node_features: "[x, y, confidence]"
  comments: "Best combination: shallow + high dropout"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"