data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GIN"
  hidden_dim: 128
  num_layers: 3
  dropout: 0.3
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gin_dropout_03_erjon"

notes:
  experiment_goal: "GIN low dropout"
  node_features: "[x, y, confidence]"
  comments: "Testing lower regularization"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"