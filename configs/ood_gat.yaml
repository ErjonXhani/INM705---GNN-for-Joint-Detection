data:
  processed_dir: "keypoints_ood"
  splits_dir: "data/splits_ood"

model:
  name: "GAT"
  hidden_dim: 256
  num_layers: 3
  heads: 8
  dropout: 0.3
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "ood_gat_heads8_hidden256_erjon"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"