data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GraphSAGE"
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "sage_final_erjon"

notes:
  experiment_goal: "Final optimized GraphSAGE model"
  node_features: "[x, y, confidence]"
  comments: "Best combination: high capacity + deeper layers"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"