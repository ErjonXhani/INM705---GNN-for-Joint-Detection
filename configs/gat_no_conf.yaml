data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GAT"
  hidden_dim: 128
  num_layers: 3
  heads: 4
  dropout: 0.6
  use_confidence: false

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gat_no_conf_omari"

notes:
  experiment_goal: "Test GAT without confidence feature"
  node_features: "[x, y]"
  comments: "Keeps the same baseline architecture but removes confidence to test whether confidence helps attention-based aggregation"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"