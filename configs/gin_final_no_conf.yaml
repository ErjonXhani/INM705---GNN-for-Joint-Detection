data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GIN"
  hidden_dim: 128
  num_layers: 2
  dropout: 0.7
  use_confidence: false

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gin_final_no_conf_erjon"

notes:
  experiment_goal: "Final GIN without confidence"
  node_features: "[x, y]"
  comments: "Testing confidence importance under the best GIN architecture"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"