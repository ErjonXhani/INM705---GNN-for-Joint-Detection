data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GraphSAGE"
  hidden_dim: 256
  num_layers: 3
  dropout: 0.5
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "sage_hidden_256"

notes:
  experiment_goal: "GraphSAGE with larger hidden dimension"
  node_features: "[x, y, confidence]"
  comments: "Testing whether increased model capacity improves GraphSAGE performance"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"