data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GAT"
  hidden_dim: 128
  num_layers: 3
  heads: 4
  dropout: 0.6
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gat_baseline_omari"

notes:
  experiment_goal: "Baseline GAT model for yoga pose classification"
  node_features: "[x, y, confidence]"
  comments: "Main attention-based baseline using 3 layers and 4 heads"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"