data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GIN"
  hidden_dim: 256
  num_layers: 2
  dropout: 0.7
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gin_256_dropout_07_erjon"

notes:
  experiment_goal: "GIN high capacity with strong regularization"
  node_features: "[x, y, confidence]"
  comments: "Testing whether dropout can stabilize a larger GIN"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"