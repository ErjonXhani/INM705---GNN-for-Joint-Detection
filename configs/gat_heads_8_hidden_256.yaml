data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"

model:
  name: "GAT"
  hidden_dim: 256
  num_layers: 3
  heads: 8
  dropout: 0.3
  use_confidence: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gat_heads8_hidden256_erjon"

notes:
  experiment_goal: "Test whether larger hidden dimension with more attention heads improve GAT performance"
  node_features: "[x, y, confidence]"
  comments: "lower dropout"
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"