# Baseline configuration for yoga pose GNN model

data:
  raw_dir: "data/raw/YogaPoses"
  processed_dir: "keypoints"
  splits_dir: "data/splits"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

model:
  name: "GCN"
  hidden_dim: 128
  num_layers: 3
  dropout: 0.5

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 3
  device: "cpu"
  checkpoint_dir: "checkpoints"
  run_name: "gcn_baseline"

notes:
  experiment_goal: "Baseline GCN on yoga pose graphs"
  node_features: "[x, y, confidence]"
  graph_setup: "MediaPipe 33-joint skeleton with undirected edges"
  comments: "First proper baseline before running feature variations"

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  output_dir: "outputs"